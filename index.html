<script>
    // MASUKKAN URL WEB APP DARI GOOGLE APPS SCRIPT DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyeLtyLamqk6rJbujzl5SwxLWri02EOm9taZGORO6DmZbTVqPg3FJJzm6FrnYWRG8CN/exec";

    let dataset = [];

    // FUNGSI MENGAMBIL DATA DARI GOOGLE SPREADSHEET
    async function fetchFromSpreadsheet() {
        try {
            const res = await fetch(SCRIPT_URL);
            dataset = await res.json();
            renderTableTU();
            renderMhsView(dataset);
        } catch (err) {
            console.error("Gagal mengambil data:", err);
        }
    }

    // FUNGSI MEMANFAATKAN POST UNTUK SIMPAN KE SPREADSHEET
    async function simpanSuratBaru(e) {
        e.preventDefault();
        const newSurat = {
            id: document.getElementById('add-id').value,
            tglMasuk: document.getElementById('add-tgl').value,
            pengirim: document.getElementById('add-pengirim').value,
            noHp: document.getElementById('add-nohp').value,
            perihal: document.getElementById('add-perihal').value,
            posisi: document.getElementById('add-posisi').value,
            status: document.getElementById('add-status').value,
            targetSelesai: document.getElementById('add-target').value,
            keterangan: document.getElementById('add-ket').value
        };

        await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "add", data: newSurat })
        });

        fetchFromSpreadsheet();
        closeModalTambah();
        alert("Surat berhasil disimpan langsung ke Google Spreadsheet!");
    }

    // LOAD DATA SAAT HALAMAN DIBUKA
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        fetchFromSpreadsheet();
    });
</script>
